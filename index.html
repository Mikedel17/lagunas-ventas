<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lagunas Green · Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0b1120;--surface:#111a2e;--surface2:#162040;
  --border:rgba(148,163,184,.08);--border-h:rgba(148,163,184,.18);
  --blue:#3b82f6;--blue-d:rgba(59,130,246,.12);
  --green:#10b981;--green-d:rgba(16,185,129,.12);
  --amber:#f59e0b;--amber-d:rgba(245,158,11,.12);
  --red:#ef4444;--red-d:rgba(239,68,68,.12);
  --purple:#8b5cf6;--cyan:#06b6d4;
  --text:#f1f5f9;--text2:#cbd5e1;--muted:#64748b;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);max-width:1100px;margin:0 auto;padding:0 0 48px;-webkit-font-smoothing:antialiased}

header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;background:linear-gradient(135deg,#10b981,#3b82f6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(16,185,129,.25)}
.logo-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.02em}
.logo-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 2.5s infinite;display:inline-block;margin-right:6px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
#lastUpdated,#rowCount{font-size:11px;color:var(--muted);font-family:var(--mono)}
#rowCount{margin-top:2px;text-align:right}

.controls{display:flex;gap:12px;padding:16px 24px 0;flex-wrap:wrap;align-items:flex-end}
.controls label{font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:4px}
.controls select{background:var(--surface);border:1px solid var(--border);color:var(--text2);font-family:var(--sans);font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;outline:none;transition:border-color .15s}
.controls select:hover,.controls select:focus{border-color:var(--blue)}

.seg-toggle{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg-btn{padding:6px 14px;background:transparent;border:none;border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.seg-btn:hover{color:var(--text2)}
.seg-btn.active{background:var(--blue);color:#fff}

#statusBanner{margin:16px 24px 0;padding:12px 16px;border-radius:8px;font-size:13px;font-family:var(--mono);display:none}
.loading{background:var(--amber-d);border:1px solid rgba(245,158,11,.25);color:var(--amber)}
.error{background:var(--red-d);border:1px solid rgba(239,68,68,.25);color:var(--red)}

main{padding:0 24px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color .15s}
.kpi:hover{border-color:var(--border-h)}
.kpi-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:10px}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:var(--mono)}
.kpi-val{font-size:24px;font-weight:700;font-family:var(--mono);color:var(--text);line-height:1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px;font-family:var(--mono)}

.sec-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-family:var(--mono);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.chart-card h3{font-size:12px;color:var(--text2);font-weight:500;margin-bottom:12px}
.chart-wrap{position:relative;height:230px}
.chart-full{grid-column:1/-1}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);font-weight:400;padding:0 10px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{text-align:left}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:rgba(59,130,246,.04)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:10px;font-family:var(--mono);font-size:12px;text-align:right;color:var(--text2)}
tbody td:first-child{text-align:left;font-family:var(--sans);font-weight:500;color:var(--text)}
.tfoot td{border-top:2px solid var(--border);font-weight:700;color:var(--text)!important;padding-top:12px}

.bar-cell{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.bar-track{width:60px;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}

.delta{font-size:11px;font-family:var(--mono);font-weight:600}
.delta.up{color:var(--green)}.delta.dn{color:var(--red)}.delta.eq{color:var(--muted)}

footer{margin-top:36px;padding:16px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);font-family:var(--mono);border-top:1px solid var(--border)}
.refresh-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:var(--mono);font-size:11px;padding:6px 14px;cursor:pointer;transition:all .15s}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-d)}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

@media(max-width:768px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .charts-row{grid-template-columns:1fr}
  .chart-full{grid-column:auto}
  header{flex-direction:column;gap:10px;align-items:flex-start}
  .controls{flex-direction:column;align-items:flex-start}
  .controls select{width:100%}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr}
  main{padding:0 16px}
  .controls{padding:12px 16px 0}
  header{padding:16px}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">$</div>
    <div>
      <div class="logo-name">Lagunas Green</div>
      <div class="logo-sub">Registro de Ventas · Esparrago</div>
    </div>
  </div>
  <div style="text-align:right">
    <div><span class="live-dot"></span><span id="lastUpdated">cargando...</span></div>
    <div id="rowCount"></div>
  </div>
</header>

<div class="controls">
  <label>Periodo <select id="fPeriodo"><option value="all">Todos los periodos</option></select></label>
  <label>Agrupar por
    <div class="seg-toggle" id="dateToggle">
      <button class="seg-btn active" data-view="dia">Dia</button>
      <button class="seg-btn" data-view="mes">Mes</button>
      <button class="seg-btn" data-view="ano">Ano</button>
    </div>
  </label>
</div>

<div id="statusBanner"></div>

<main>
  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="sec-title">tendencia de ingresos</div>
  <div class="charts-row">
    <div class="chart-card">
      <h3>Total vendido (USD)</h3>
      <div class="chart-wrap"><canvas id="revenueChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Precio promedio por kg (USD)</h3>
      <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
    </div>
  </div>

  <div class="sec-title">tendencia de volumen</div>
  <div class="charts-row">
    <div class="chart-card chart-full">
      <h3>Peso neto (kg)</h3>
      <div class="chart-wrap"><canvas id="weightChart"></canvas></div>
    </div>
  </div>

  <div class="sec-title">comparativa por periodo</div>
  <div class="chart-card">
    <div class="table-scroll">
      <table><thead id="compHead"></thead><tbody id="compBody"></tbody></table>
    </div>
  </div>
</main>

<footer>
  <span>Google Sheets · auto-refresh 5 min</span>
  <button class="refresh-btn" onclick="loadData()">&#8635; Actualizar ahora</button>
</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQEll-BW_UewDrwyXnwNbl5qiyXSOAs5TSbs82yJltOzMy2qA_iSsMEhlVsfecD2hLzARX5SNCFcGA8/pub?gid=505628585&single=true&output=csv';

const MONTHS = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

const fmt = {
  usd: v => '$' + Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
  usdShort: v => v >= 10000 ? '$'+(v/1000).toFixed(1)+'k' : v >= 1000 ? '$'+(v/1000).toFixed(1)+'k' : '$'+v.toFixed(0),
  kg: v => Number(v).toLocaleString('en-US',{maximumFractionDigits:1})+' kg',
  kgShort: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0),
  n: v => Number(v).toLocaleString('en-US'),
  price: v => '$'+Number(v).toFixed(2),
  pct: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%'
};

function parseCSV(txt) {
  const lines = txt.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const cols = []; let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cols[i] || '').replace(/"/g,'').trim());
    return obj;
  }).filter(r => r['Fecha'] && r['Peso Neto'] && !isNaN(parseFloat(r['Peso Neto'])));
}

function sortKey(d) {
  const p = d.split('/');
  if (p.length === 3) return p[2].padStart(4,'0') + p[1].padStart(2,'0') + p[0].padStart(2,'0');
  return d;
}

function shortDate(d) {
  const p = d.split('/');
  return p.length >= 2 ? p[0]+'/'+p[1] : d;
}

function shortPeriodo(p) {
  const parts = p.split(' - ');
  if (parts.length !== 2) return p;
  const [d1, d2] = parts.map(s => s.trim().split('/'));
  if (d1.length !== 3 || d2.length !== 3) return p;
  const m1 = MONTHS[parseInt(d1[1])] || d1[1];
  const m2 = MONTHS[parseInt(d2[1])] || d2[1];
  const y1 = d1[2].slice(-2), y2 = d2[2].slice(-2);
  return y1 === y2 ? m1+'-'+m2+' '+y1 : m1+' '+y1+'-'+m2+' '+y2;
}

function monthLabel(key) {
  const [m, y] = key.split('/');
  return MONTHS[parseInt(m)] + ' ' + y.slice(-2);
}

// --- Aggregation ---

function aggregate(rows, view) {
  const map = {};
  rows.forEach(r => {
    const p = r['Fecha'].split('/');
    let key;
    if (view === 'dia') key = r['Fecha'];
    else if (view === 'mes') key = p[1].padStart(2,'0') + '/' + p[2];
    else key = p[2];
    if (!map[key]) map[key] = { key, kg: 0, usd: 0, cajas: 0, days: new Set() };
    map[key].kg += parseFloat(r['Peso Neto']) || 0;
    map[key].usd += parseFloat(r['Total Dia']) || 0;
    map[key].cajas += parseInt(r['Num Cajas']) || 0;
    map[key].days.add(r['Fecha']);
  });
  const arr = Object.values(map);
  arr.forEach(d => { d.price = d.kg > 0 ? d.usd / d.kg : 0; d.numDays = d.days.size; });
  arr.sort((a, b) => {
    if (view === 'dia') return sortKey(a.key).localeCompare(sortKey(b.key));
    if (view === 'mes') { const [ma,ya] = a.key.split('/'); const [mb,yb] = b.key.split('/'); return (ya+ma).localeCompare(yb+mb); }
    return a.key.localeCompare(b.key);
  });
  return arr;
}

function labelFor(key, view) {
  if (view === 'dia') return shortDate(key);
  if (view === 'mes') return monthLabel(key);
  return key;
}

// --- State ---

let allRows = [];
let dateView = 'dia';
let charts = {};

function getFiltered() {
  const fP = document.getElementById('fPeriodo').value;
  return fP === 'all' ? allRows : allRows.filter(r => r['Periodo'] === fP);
}

function populateFilters(rows) {
  const periodos = [...new Set(rows.map(r => r['Periodo']))].sort((a, b) => {
    return sortKey(a.split(' - ')[0]).localeCompare(sortKey(b.split(' - ')[0]));
  });
  const sel = document.getElementById('fPeriodo');
  const prev = sel.value;
  sel.innerHTML = '<option value="all">Todos los periodos</option>' +
    periodos.map(p => '<option value="'+p+'">'+shortPeriodo(p)+'</option>').join('');
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
}

// --- Render ---

function renderAll() {
  const rows = getFiltered();
  if (!rows.length) return;
  const data = aggregate(rows, dateView);

  const totalUsd = rows.reduce((s,r) => s + (parseFloat(r['Total Dia']) || 0), 0);
  const totalKg  = rows.reduce((s,r) => s + (parseFloat(r['Peso Neto']) || 0), 0);
  const totalCajas = rows.reduce((s,r) => s + (parseInt(r['Num Cajas']) || 0), 0);
  const avgPrice = totalKg > 0 ? totalUsd / totalKg : 0;
  const numDays = new Set(rows.map(r => r['Fecha'])).size;
  const numPeriods = new Set(rows.map(r => r['Periodo'])).size;

  renderKPIs(totalUsd, totalKg, avgPrice, totalCajas, numDays, numPeriods);
  renderRevenueChart(data);
  renderPriceChart(data);
  renderWeightChart(data);
  renderComparisonTable(allRows);
}

function renderKPIs(usd, kg, price, cajas, days, periods) {
  const avgDaily = days > 0 ? usd / days : 0;
  const avgDailyKg = days > 0 ? kg / days : 0;
  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi">
      <div class="kpi-icon" style="background:var(--blue-d)">&#128176;</div>
      <div class="kpi-label">Total vendido</div>
      <div class="kpi-val">${fmt.usd(usd)}</div>
      <div class="kpi-sub">${fmt.usd(avgDaily)} / dia prom</div>
    </div>
    <div class="kpi">
      <div class="kpi-icon" style="background:var(--green-d)">&#9878;</div>
      <div class="kpi-label">Peso neto total</div>
      <div class="kpi-val">${fmt.kg(kg)}</div>
      <div class="kpi-sub">${fmt.kg(avgDailyKg)} / dia prom</div>
    </div>
    <div class="kpi">
      <div class="kpi-icon" style="background:var(--amber-d)">&#9733;</div>
      <div class="kpi-label">Precio promedio</div>
      <div class="kpi-val">${fmt.price(price)}/kg</div>
      <div class="kpi-sub">${fmt.n(cajas)} cajas</div>
    </div>
    <div class="kpi">
      <div class="kpi-icon" style="background:rgba(139,92,246,.12)">&#128197;</div>
      <div class="kpi-label">Dias de cosecha</div>
      <div class="kpi-val">${days}</div>
      <div class="kpi-sub">${periods} periodo${periods !== 1 ? 's' : ''}</div>
    </div>`;
}

function renderRevenueChart(data) {
  const labels = data.map(d => labelFor(d.key, dateView));
  if (charts.revenue) charts.revenue.destroy();
  charts.revenue = new Chart(document.getElementById('revenueChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Total USD',
        data: data.map(d => d.usd),
        backgroundColor: 'rgba(59,130,246,.7)',
        borderRadius: 3, borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: ctx => dateView === 'dia' ? ctx[0].label : ctx[0].label,
          label: ctx => 'Total: ' + fmt.usd(ctx.parsed.y),
          afterLabel: ctx => dateView !== 'dia' ? data[ctx.dataIndex].numDays + ' dias' : ''
        }}
      },
      scales: {
        x: { ticks: { color: '#475569', font: { size: 10 }, maxRotation: 45 }, grid: { display: false } },
        y: { ticks: { color: '#475569', font: { size: 10 }, callback: v => fmt.usdShort(v) }, grid: { color: 'rgba(148,163,184,.06)' } }
      }
    }
  });
}

function renderPriceChart(data) {
  const labels = data.map(d => labelFor(d.key, dateView));
  if (charts.price) charts.price.destroy();
  charts.price = new Chart(document.getElementById('priceChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Precio/kg',
        data: data.map(d => d.price),
        borderColor: '#f59e0b',
        backgroundColor: 'rgba(245,158,11,.08)',
        borderWidth: 2.5, pointRadius: dateView === 'dia' ? 3 : 5,
        pointBackgroundColor: '#f59e0b',
        tension: 0.3, fill: true
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: ctx => 'Precio: ' + fmt.price(ctx.parsed.y) + '/kg',
          afterLabel: ctx => dateView !== 'dia' ? data[ctx.dataIndex].numDays + ' dias · ' + fmt.kg(data[ctx.dataIndex].kg) : ''
        }}
      },
      scales: {
        x: { ticks: { color: '#475569', font: { size: 10 }, maxRotation: 45 }, grid: { display: false } },
        y: { ticks: { color: '#475569', font: { size: 10 }, callback: v => '$'+v.toFixed(1) }, grid: { color: 'rgba(148,163,184,.06)' } }
      }
    }
  });
}

function renderWeightChart(data) {
  const labels = data.map(d => labelFor(d.key, dateView));
  if (charts.weight) charts.weight.destroy();
  charts.weight = new Chart(document.getElementById('weightChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Peso Neto (kg)',
        data: data.map(d => d.kg),
        backgroundColor: 'rgba(16,185,129,.65)',
        borderRadius: 3, borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: ctx => 'Peso: ' + fmt.kg(ctx.parsed.y),
          afterLabel: ctx => fmt.n(data[ctx.dataIndex].cajas) + ' cajas' + (dateView !== 'dia' ? ' · ' + data[ctx.dataIndex].numDays + ' dias' : '')
        }}
      },
      scales: {
        x: { ticks: { color: '#475569', font: { size: 10 }, maxRotation: 45 }, grid: { display: false } },
        y: { ticks: { color: '#475569', font: { size: 10 }, callback: v => fmt.kgShort(v) }, grid: { color: 'rgba(148,163,184,.06)' } }
      }
    }
  });
}

function renderComparisonTable(rows) {
  document.getElementById('compHead').innerHTML = `<tr>
    <th style="text-align:left">Periodo</th>
    <th>Dias</th><th>Cajas</th>
    <th>Peso Neto</th><th>Kg/Dia</th>
    <th>Total USD</th><th>USD/Dia</th>
    <th>Precio Prom</th>
  </tr>`;

  const periodos = [...new Set(rows.map(r => r['Periodo']))].sort((a, b) =>
    sortKey(a.split(' - ')[0]).localeCompare(sortKey(b.split(' - ')[0]))
  );

  const stats = periodos.map(p => {
    const pr = rows.filter(r => r['Periodo'] === p);
    const dias = new Set(pr.map(r => r['Fecha'])).size;
    const cajas = pr.reduce((s,r) => s + (parseInt(r['Num Cajas']) || 0), 0);
    const kg = pr.reduce((s,r) => s + (parseFloat(r['Peso Neto']) || 0), 0);
    const usd = pr.reduce((s,r) => s + (parseFloat(r['Total Dia']) || 0), 0);
    const price = kg > 0 ? usd / kg : 0;
    return { periodo: p, dias, cajas, kg, usd, price, kgDia: dias > 0 ? kg/dias : 0, usdDia: dias > 0 ? usd/dias : 0 };
  });

  const maxKg = Math.max(...stats.map(s => s.kg));
  const maxUsd = Math.max(...stats.map(s => s.usd));
  const maxPrice = Math.max(...stats.map(s => s.price));
  const tDias = stats.reduce((s,r) => s+r.dias, 0);
  const tCajas = stats.reduce((s,r) => s+r.cajas, 0);
  const tKg = stats.reduce((s,r) => s+r.kg, 0);
  const tUsd = stats.reduce((s,r) => s+r.usd, 0);

  let html = stats.map((s, i) => {
    const prev = i > 0 ? stats[i-1] : null;
    const dKg = prev ? ((s.kgDia - prev.kgDia) / prev.kgDia * 100) : null;
    const dUsd = prev ? ((s.usdDia - prev.usdDia) / prev.usdDia * 100) : null;
    const dPrice = prev ? ((s.price - prev.price) / prev.price * 100) : null;
    const kgPct = maxKg > 0 ? s.kg / maxKg * 100 : 0;
    const usdPct = maxUsd > 0 ? s.usd / maxUsd * 100 : 0;
    const pricePct = maxPrice > 0 ? s.price / maxPrice * 100 : 0;

    function delta(v) {
      if (v === null) return '';
      const cls = v > 0 ? 'up' : v < 0 ? 'dn' : 'eq';
      return ' <span class="delta '+cls+'">' + fmt.pct(v) + '</span>';
    }

    return `<tr>
      <td>${shortPeriodo(s.periodo)}</td>
      <td>${s.dias}</td>
      <td>${fmt.n(s.cajas)}</td>
      <td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${kgPct}%;background:var(--green)"></div></div>${fmt.kg(s.kg)}</div></td>
      <td>${fmt.kg(s.kgDia)}${delta(dKg)}</td>
      <td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${usdPct}%;background:var(--blue)"></div></div>${fmt.usd(s.usd)}</div></td>
      <td>${fmt.usd(s.usdDia)}${delta(dUsd)}</td>
      <td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${pricePct}%;background:var(--amber)"></div></div>${fmt.price(s.price)}${delta(dPrice)}</div></td>
    </tr>`;
  }).join('');

  const tPrice = tKg > 0 ? tUsd / tKg : 0;
  html += `<tr class="tfoot">
    <td>Total</td>
    <td>${tDias}</td><td>${fmt.n(tCajas)}</td>
    <td>${fmt.kg(tKg)}</td><td>${fmt.kg(tDias > 0 ? tKg/tDias : 0)}</td>
    <td>${fmt.usd(tUsd)}</td><td>${fmt.usd(tDias > 0 ? tUsd/tDias : 0)}</td>
    <td>${fmt.price(tPrice)}</td>
  </tr>`;

  document.getElementById('compBody').innerHTML = html;
}

// --- Controls ---

document.getElementById('dateToggle').addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn');
  if (!btn) return;
  document.querySelectorAll('#dateToggle .seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  dateView = btn.dataset.view;
  renderAll();
});

document.getElementById('fPeriodo').addEventListener('change', renderAll);

// --- Load ---

function showStatus(type, msg) {
  const b = document.getElementById('statusBanner');
  b.className = type; b.textContent = msg; b.style.display = 'block';
}

async function loadData() {
  showStatus('loading', 'Cargando datos desde Google Sheets...');
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    if (!rows.length) throw new Error('CSV vacio o sin datos.');
    allRows = rows;
    populateFilters(rows);
    document.getElementById('statusBanner').style.display = 'none';
    renderAll();
    document.getElementById('lastUpdated').textContent =
      'Actualizado ' + new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('rowCount').textContent = rows.length + ' registros';
  } catch(e) {
    showStatus('error', 'Error: ' + e.message + ' — Verifica que el Sheet este publicado.');
    document.getElementById('lastUpdated').textContent = 'Error al cargar';
  }
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
